apiVersion: apps/v1
kind: Deployment
metadata:
  name: resume
  namespace: web
  labels:
    app: resume
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: resume
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: resume
    spec:
      # espalha as replicas entre node1 e node2
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: resume
      containers:
        - name: resume
          image: ghcr.io/rafaelchei/resume:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits:   { memory: 64Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: resume
  namespace: web
spec:
  selector:
    app: resume
  ports:
    - name: http
      port: 80
      targetPort: http
