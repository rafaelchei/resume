apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resume
  namespace: web
  annotations:
    # TLS termina na Cloudflare; aqui dentro e HTTP puro
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: chei.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume
                port:
                  number: 80
    - host: www.chei.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: resume
                port:
                  number: 80
